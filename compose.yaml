services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: webwatch
      POSTGRES_USER: webwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webwatch-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webwatch -d webwatch"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://webwatch:${POSTGRES_PASSWORD:-webwatch-local-password}@postgres:5432/webwatch
      HOST: 0.0.0.0
      PORT: 8080
      SCREENSHOT_DIR: /data/screenshots
    volumes:
      - screenshots:/data/screenshots
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - backend

volumes:
  postgres_data:
  screenshots:

networks:
  backend:
